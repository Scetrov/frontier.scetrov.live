name: Docs validation

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    name: Validate documentation (Hugo, linters, spellcheck, linkcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install devDependencies (markdownlint-cli, cspell)
        run: npm ci

      - name: Node & npm versions (debug)
        run: |
          node -v || true
          npm -v || true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Run World Contracts comparison helper tests
        run: python3 -m unittest scripts/tests/test_update_world_contracts_version_comparison.py

      - name: Build site
        run: hugo build -d public

      - name: Run markdownlint
        run: npm run lint:md

      - name: Validate TOML frontmatter
        run: ./.githooks/validate-frontmatter.sh

      - name: Run cspell (spellcheck)
        run: npm run spell

      - name: Set up Go (for htmltest)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'

      - name: Install htmltest
        run: |
          go install github.com/wjdp/htmltest@v0.17.0
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run htmltest (full-site link/HTML checks)
        run: htmltest -c .htmltest.yml -s public
