name: Docs validation

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    name: Validate documentation (Hugo, linters, spellcheck, linkcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install devDependencies (markdownlint-cli, cspell)
        run: npm ci

      - name: Node & npm versions (debug)
        run: |
          node -v || true
          npm -v || true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3
        with:
          hugo-version: '0.170.1'

      - name: Run World Contracts comparison helper tests
        run: python3 -m unittest scripts/tests/test_update_world_contracts_version_comparison.py

      - name: Build site
        run: hugo build -d public

      - name: Run markdownlint
        run: npm run lint:md

      - name: Run Mermaid lint
        # Use the runner-installed Chrome, whose sandbox is supported by Ubuntu's
        # AppArmor policy, rather than Puppeteer's downloaded Chrome for Testing.
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm run lint:mermaid

      - name: Validate TOML frontmatter
        run: ./.githooks/validate-frontmatter.sh

      - name: Run cspell (spellcheck)
        run: npm run spell

      - name: Set up Go (for htmltest)
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.5'

      - name: Install htmltest
        run: |
          go install github.com/wjdp/htmltest@v0.17.0
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run htmltest (full-site link/HTML checks)
        run: htmltest -c .htmltest.yml -s public
